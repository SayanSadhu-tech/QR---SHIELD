<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Reset Password</title><link rel="stylesheet" href="style.css"></head>
<body>
    <div class="main-content">
        <div class="auth-box">
            <h1>Reset Password</h1>
            <p style="margin-bottom: 20px; font-size: 0.9rem; color: #666;">Enter your email to receive a recovery link.</p>
            <div class="input-group">
                <input type="email" placeholder="Email Address">
            </div>
            <button onclick="alert('Recovery link sent!')">Send Link</button>
            <a href="index.html" style="display:block; margin-top:20px; color:var(--primary);">Back to Login</a>
        </div>
    </div>
</body>
</html>
