<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Create Account</title><link rel="stylesheet" href="style.css"></head>
<body>
    <div class="main-content">
        <div class="auth-box">
            <h1 style="color: var(--primary); margin-bottom: 20px;">Create Account ✅</h1>
            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email Address">
            <input type="tel" placeholder="Phone Number">
            <input type="text" placeholder="Choose a Username">
            <input type="password" placeholder="Choose a Password">
            <input type="password" placeholder="Confirm Password">
            <button onclick="location.href='index.html'">Register</button>
            <p style="margin-top: 20px; font-size: 0.9rem;">
                Already have an account? <a href="index.html" style="color:var(--primary); text-decoration:none; font-weight:bold;">Login here</a>
            </p>
        </div>
    </div>
</body>
</html>
