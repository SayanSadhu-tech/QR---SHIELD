<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account - QR Scanner</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="theme-menu-container">
        <button id="menu-toggle" class="kebab-menu-button">&#x22EE;</button>
        <div id="theme-controls-dropdown" class="theme-controls-dropdown">
            <button id="theme-toggle" class="menu-item">🌙 Dark Mode</button>
        </div>
    </div>

    <main class="main-content">
        <h1 class="page-title">Account Verification</h1>
        <div class="auth-box">
            <p style="text-align: center; margin-bottom: 25px; color: var(--primary-color);">
                A 6-digit verification code has been "sent" to your registered email and phone.
            </p>
            <form id="verification-form">
                <div class="form-group">
                    <label for="otp-code">Enter Verification Code (6 Digits)</label>
                    <input type="text" id="otp-code" name="otp-code" placeholder="Enter OTP" required maxlength="6" pattern="\d{6}">
                </div>
                
                <p id="verification-error" style="color: var(--danger-border); text-align: center; margin-top: 10px;"></p>
                
                <button type="submit" class="btn-auth">Verify Account</button>
            </form>
            <p style="text-align: center; margin-top: 20px;">
                <a href="register.html" style="color: var(--secondary-color);">Go back to Registration</a>
            </p>
        </div>
    </main>

    <script src="verify.js"></script> 
</body>
</html>
